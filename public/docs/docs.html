<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KuroNeko | Documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/assets/tailwind.css">
<link rel="stylesheet" href="/assets/icons.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/assets/open-glass-ui.css">
<link rel="stylesheet" href="/assets/glass-theme.css">
<link rel="stylesheet" href="/docs/docs.css">
<link rel="stylesheet" href="/assets/responsive.css">
</head>
<body class="ogui-theme ogui-app min-h-screen flex flex-col relative" data-ogui-theme="" data-ogui-design="liquid" data-ogui-appearance="dark" data-ogui-motion="on">

<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true">
    <div class="blob blob-a w-[420px] h-[420px] top-[-8%] left-[10%]"></div>
    <div class="blob blob-b w-[380px] h-[380px] top-[20%] right-[5%]"></div>
    <div class="blob blob-c w-[460px] h-[460px] bottom-[-10%] left-[25%]"></div>
</div>

<header id="site-header" class="site-header">
    <div class="header-inner">
        <button id="menu-toggle" class="clay-icon-btn ogui-button ogui-control--medium ogui-icon-button mobile-only" aria-label="Buka menu" aria-expanded="false" aria-controls="sidebar">
            <i class="fa-solid fa-bars text-sm"></i>
        </button>

        <div class="brand">
            <div class="min-w-0">
                <span class="ogui-badge brand-badge" data-tone="accent">API PLATFORM</span>
                <h1 id="nav-title" class="brand-title">KURONEKO</h1>
                <span class="brand-sub">DOCUMENTATION</span>
            </div>
        </div>

        <div class="header-actions ogui-toolbar" role="toolbar" aria-label="Aksi cepat" aria-orientation="horizontal" data-orientation="horizontal" data-ogui-glass="" data-ogui-design="liquid" data-ogui-material="regular" data-ogui-tone="auto">
            <a href="/" class="clay-icon-btn ogui-button ogui-control--medium ogui-icon-button" aria-label="Kembali ke Beranda">
                <i class="fa-solid fa-house text-sm"></i>
            </a>
            <a href="https://github.com/DanzzAraAra" target="_blank" rel="noopener" class="clay-icon-btn ogui-button ogui-control--medium ogui-icon-button" aria-label="Source Code">
                <i class="fa-brands fa-github text-lg brand-github-icon"></i>
            </a>
        </div>
    </div>
</header>

<div id="sidebar-overlay" class="sidebar-overlay"></div>

<div class="app-shell">

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">
            <button id="sidebar-close" class="clay-icon-btn ogui-button ogui-control--medium ogui-icon-button mobile-only" aria-label="Tutup menu">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <div class="ogui-field search-field relative">
            <span class="ogui-sr-only">Cari endpoint</span>
            <input type="text" id="search-input" placeholder="Cari endpoint..." class="clay-input ogui-search pl-11 h-11">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
        </div>

        <div id="sidebar-tree" class="sidebar-tree"></div>

        <div id="no-results" class="hidden flex-col items-center justify-center py-8 text-center">
            <i class="fa-solid fa-magnifying-glass no-results-icon"></i>
            <p class="font-bold text-sm no-results-text">Endpoint tidak ditemukan</p>
        </div>

        <div class="sidebar-foot">
            <p class="font-mono text-[10px] font-semibold uppercase tracking-widest sidebar-foot-text">
                Powered by <span class="sidebar-foot-accent">Danzz</span> &bull; 2026
            </p>
        </div>
    </aside>

    <main class="main-area">
        <div class="content-stack">

            <div class="top-row">
                <div class="clay-console ogui-card reveal">
                    <div class="clay-console-screen term-screen">
                        <div class="term-head">
                            <div class="term-dots">
                                <span class="term-dot term-dot-red"></span>
                                <span class="term-dot term-dot-amber"></span>
                                <span class="term-dot term-dot-green"></span>
                            </div>
                            <span class="term-title">root@kuroneko ~</span>
                        </div>

                        <div id="term-logs" class="font-mono p-4 text-[11px] overflow-y-auto flex-1 space-y-1.5 leading-relaxed"></div>

                        <div id="term-input-line" class="hidden px-4 pb-3 pt-2 border-t border-white/10 font-mono">
                            <span class="term-prompt">➜</span>
                            <span class="term-path">~</span>
                            <span class="inline-block w-2 h-4 bg-slate-400 align-middle blink-cursor"></span>
                        </div>
                    </div>
                </div>

                <div class="clay-card ogui-card stats-card p-4 sm:p-5 reveal">
                    <div class="stat-grid">
                        <div class="ogui-stat stat-tile">
                            <span class="stat-label"><i class="fa-regular fa-clock"></i> WAKTU (WIB)</span>
                            <strong id="server-time" class="stat-value font-mono">--:--:--</strong>
                        </div>

                        <div class="ogui-stat stat-tile">
                            <span class="stat-label"><i class="fa-regular fa-calendar"></i> TANGGAL</span>
                            <strong id="server-date" class="stat-value font-mono">--/--/----</strong>
                        </div>

                        <div class="ogui-stat stat-tile">
                            <span class="stat-label"><i class="fa-solid fa-battery-half"></i> BATERAI</span>
                            <strong id="stat-battery" class="stat-value accent font-mono">--%</strong>
                        </div>

                        <div class="ogui-stat stat-tile">
                            <span class="stat-label"><i class="fa-solid fa-mobile-screen"></i> DEVICE</span>
                            <strong id="stat-device" class="stat-value accent">Unknown</strong>
                        </div>
                    </div>
                </div>
            </div>

            <section id="content-col" class="content-col">
                <div id="intro-view" class="clay-card ogui-card p-5 sm:p-7 reveal"></div>
                <div id="endpoint-view" class="hidden flex-col gap-4"></div>
            </section>

        </div>
    </main>

</div>

<div id="custom-toast" class="toast-wrap transform translate-y-32 opacity-0 transition-all duration-300">
    <div class="toast-box ogui-alert" role="status" data-tone="positive">
        <span class="toast-check ogui-alert__signal" aria-hidden="true"><i class="fa-solid fa-check text-xs"></i></span>
        <div><strong id="toast-message" class="tracking-wide text-sm">SUCCESS</strong></div>
    </div>
</div>

<script src="/docs/docs.js"></script>
</body>
</html>
